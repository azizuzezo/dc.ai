server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      # Native youtube source is disabled — the youtube-source plugin below
      # replaces it. Lavalink's built-in source stopped working reliably
      # because it doesn't keep up with YouTube's anti-bot changes.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    opusEncodingQuality: 10
    resamplingQuality: LOW

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # TV is the only client that actually uses the OAuth-signed-in
      # session below; the rest are anonymous fallbacks for when OAuth
      # itself is unavailable.
      - TV
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # Anonymous clients increasingly hit "This video requires login" from
    # YouTube's anti-bot checks. OAuth (a real Google account's refresh
    # token) is the plugin's own documented workaround — completed once via
    # the device-code flow printed on first boot; the resulting token is
    # injected via the YOUTUBE_OAUTH_REFRESH_TOKEN env var so it survives
    # redeploys without repeating that flow.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN}"

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 5
